<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Main top wing gradient: from vivid red-orange to bright golden yellow -->
    <linearGradient id="sf-top-wing" x1="20%" y1="50%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#FF3700" />
      <stop offset="35%" stop-color="#FF6A00" />
      <stop offset="70%" stop-color="#FFAE00" />
      <stop offset="100%" stop-color="#FFE838" />
    </linearGradient>

    <!-- Center crease facet: slightly deeper orange to create the 3D folded edge -->
    <linearGradient id="sf-crease" x1="25%" y1="55%" x2="85%" y2="20%">
      <stop offset="0%" stop-color="#E52D00" />
      <stop offset="40%" stop-color="#FF4800" />
      <stop offset="80%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#FFC000" />
    </linearGradient>

    <!-- Central body blade gradient -->
    <linearGradient id="sf-mid-blade" x1="25%" y1="65%" x2="85%" y2="20%">
      <stop offset="0%" stop-color="#FF3000" />
      <stop offset="45%" stop-color="#FF6F00" />
      <stop offset="85%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#FFDE25" />
    </linearGradient>

    <!-- Lower long tail stream gradient -->
    <linearGradient id="sf-lower-tail" x1="10%" y1="80%" x2="60%" y2="50%">
      <stop offset="0%" stop-color="#E62600" />
      <stop offset="30%" stop-color="#FF4000" />
      <stop offset="70%" stop-color="#FF7500" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <!-- Small accent spur tail -->
    <linearGradient id="sf-spur-tail" x1="38%" y1="80%" x2="60%" y2="58%">
      <stop offset="0%" stop-color="#E62E00" />
      <stop offset="50%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>

    <!-- Right wing facet (lower wing underside) -->
    <linearGradient id="sf-right-wing-dark" x1="50%" y1="50%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#FF4200" />
      <stop offset="55%" stop-color="#E83000" />
      <stop offset="100%" stop-color="#D42000" />
    </linearGradient>

    <!-- Right wing outer face (leading to nose) -->
    <linearGradient id="sf-right-wing-light" x1="70%" y1="80%" x2="88%" y2="17%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="40%" stop-color="#FF8C00" />
      <stop offset="80%" stop-color="#FFC500" />
      <stop offset="100%" stop-color="#FFEE4A" />
    </linearGradient>
  </defs>

  <!-- 1. Right Underwing Back Facet -->
  <path
    d="M 54.5 60.5 L 69.2 78.8 L 61.5 63.5 L 54.5 60.5 Z"
    fill="url(#sf-right-wing-dark)"
  />

  <!-- 2. Right Underwing Main Triangular Facet -->
  <path
    d="M 87.2 16.5 L 69.2 78.8 L 57.5 59.5 L 75.8 30.5 Z"
    fill="url(#sf-right-wing-light)"
  />

  <!-- 3. Small curved bottom spur tail -->
  <path
    d="M 39.2 77.2 C 43.8 74.8 50.2 68.5 54.2 60.2 C 50.0 64.5 45.0 70.0 39.2 77.2 Z"
    fill="url(#sf-spur-tail)"
  />

  <!-- 4. Longest lower curved stream tail -->
  <path
    d="M 12.8 76.8 C 21.5 75.8 32.5 70.8 42.2 62.0 C 47.8 57.0 52.5 51.2 55.0 46.5 C 50.2 52.5 43.0 59.8 34.0 65.5 C 25.5 71.0 17.5 74.8 12.8 76.8 Z"
    fill="url(#sf-lower-tail)"
  />

  <!-- 5. Middle curved blade stream -->
  <path
    d="M 19.2 63.5 C 26.5 61.8 35.8 55.8 44.5 46.8 C 52.2 38.8 63.5 28.5 76.2 21.5 C 67.5 29.8 54.5 43.2 44.0 51.5 C 33.5 59.8 24.5 62.8 19.2 63.5 Z"
    fill="url(#sf-mid-blade)"
  />

  <!-- 6. Main Top Wing Lower Crease Facet -->
  <path
    d="M 20.2 43.5 L 35.5 50.8 L 55.0 45.2 L 87.2 16.5 L 35.5 50.8 Z"
    fill="url(#sf-crease)"
  />

  <!-- 7. Main Top Wing Outer Facet (Leading Edge to Nose) -->
  <path
    d="M 20.2 43.5 L 87.2 16.5 L 35.5 50.8 Z"
    fill="url(#sf-top-wing)"
  />
</svg>
